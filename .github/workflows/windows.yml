name: Desktop build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-runtime:
    name: Windows playback-only FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: runtime
        with:
          path: target/windows-runtime
          key: windows-playback-runtime-${{ hashFiles('scripts/build-windows-runtime.sh', 'scripts/ffmpeg-playback-options.sh', 'scripts/verify-ffmpeg-config.py') }}
      - name: Build with pinned BtbN dependencies
        if: steps.runtime.outputs.cache-hit != 'true'
        run: ./scripts/build-windows-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ffmpeg-runtime
          path: target/windows-runtime/*
          if-no-files-found: error

  build:
    needs: windows-runtime
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      # Bundle the MSVC runtime in the application, avoiding an extra install step.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: Check installer script before building
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'target/installer-check'
          $output = Join-Path $PWD 'target/installer-check-output'
          New-Item -ItemType Directory -Path (Join-Path $stage 'icons') -Force | Out-Null
          Copy-Item assets/branding/replayer.ico (Join-Path $stage 'icons/replayer-check.ico')
          # Only compile the installer script; this fixture is never launched or published.
          Set-Content -LiteralPath (Join-Path $stage 'replayer.exe') -Value 'Installer syntax fixture' -Encoding ascii
          $iscc = @('C:/Program Files (x86)/Inno Setup 6/ISCC.exe', 'C:/Program Files/Inno Setup 6/ISCC.exe', 'C:/Program Files (x86)/Inno Setup 7/ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found.' }
          & $iscc '/DAppVersion=0.0.0' "/DSourceDir=$stage" "/DOutputDir=$output" '/DAppIconFile=replayer-check.ico' 'installer/replayer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .deps/ffmpeg-ci.zip
          key: windows-x64-${{ hashFiles('Cargo.lock', 'scripts/setup-windows.ps1') }}
          restore-keys: |
            windows-x64-
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg-runtime
          path: target/windows-runtime
      - name: Set up verified playback-only FFmpeg and LLVM
        shell: pwsh
        run: ./scripts/setup-windows.ps1 -RuntimeArchive target/windows-runtime/ffmpeg-playback.zip -WithTestTools
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq replayer).version
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_TAG -cne "v$version") {
            throw "Tag must be v$version to match Cargo.toml"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Check formatting, lint and tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows x64
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Build installer and portable package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/replayer.exe
      - name: Smoke test installed package
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'replayer-smoke'
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          ./scripts/test-installed-icons.ps1 -Installer $setup.FullName -InstallDirectory $installDir
          $media = Join-Path $env:RUNNER_TEMP 'replayer-smoke.mp4'
          & $env:REPLAYER_TEST_FFMPEG -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=4' -c:v mpeg4 $media
          if ($LASTEXITCODE -ne 0) { throw 'Smoke media creation failed.' }
          $env:REPLAYER_SOFTWARE = '1'
          $savedPath = $env:PATH
          try {
            # Prevent missing package DLLs from being supplied by the build environment.
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $process = Start-Process -FilePath (Join-Path $installDir 'replayer.exe') -ArgumentList @('--selftest', ('"' + $media + '"')) -WorkingDirectory $installDir -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installed player selftest failed: $($process.ExitCode)" }
          } finally { $env:PATH = $savedPath }
      - uses: actions/upload-artifact@v4
        with:
          name: replayer-${{ env.APP_VERSION }}-windows-x86_64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Check formatting and release version
        run: |
          cargo fmt --all -- --check
          version=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "replayer"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must be v$version to match Cargo.toml" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          brew install pkg-config nasm ffmpeg
          echo "REPLAYER_TEST_FFMPEG=$(brew --prefix ffmpeg)/bin/ffmpeg" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            .deps/macos-${{ matrix.arch }}
            .deps/macos-sources
          key: macos-runtime-${{ matrix.target }}-${{ hashFiles('scripts/setup-macos.sh', 'scripts/ffmpeg-playback-options.sh', 'scripts/verify-ffmpeg-config.py') }}
      - name: Set up pinned FFmpeg, LAME and libclang
        run: ./scripts/setup-macos.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
            target/debug
          key: macos-rust-v2-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'scripts/setup-macos.sh') }}
          restore-keys: |
            macos-rust-v2-${{ matrix.target }}-
            macos-rust-${{ matrix.target }}-
      - name: Lint and test
        run: |
          cargo clippy --locked --target '${{ matrix.target }}' --all-targets -- -D warnings
          REPLAYER_SETTINGS_FILE="$PWD/target/ci-macos-settings.json" cargo test --locked --target '${{ matrix.target }}'
      - name: Build macOS application
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Package and test relocated application
        run: |
          python3 scripts/package-macos.py --binary 'target/${{ matrix.target }}/release/replayer' --output-directory 'dist/macos-${{ matrix.arch }}'
          python3 scripts/test-macos-package.py --directory 'dist/macos-${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: replayer-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}
          path: |
            dist/macos-${{ matrix.arch }}/*.dmg
            dist/macos-${{ matrix.arch }}/*.zip
            dist/macos-${{ matrix.arch }}/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: replayer-*
          path: dist
          merge-multiple: true
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Canonical LF endings across the PowerShell and macOS manifests.
          tr -d '\r' < dist/SHA256SUMS.txt > dist/SHA256SUMS-windows-x86_64.txt
          cat dist/SHA256SUMS-windows-x86_64.txt dist/SHA256SUMS-macos-*.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          assets=(dist/*.exe dist/*.zip dist/*.dmg dist/SHA256SUMS*.txt)
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
          else
            NOTES="docs/releases/$RELEASE_TAG.md"
            python scripts/validate-release-notes.py --tag "$RELEASE_TAG" --file "$NOTES"
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          gh release view "$RELEASE_TAG" --json name,tagName,body > dist/published-release.json
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            python scripts/validate-release-notes.py --tag "$RELEASE_TAG" --file "docs/releases/$RELEASE_TAG.md" --published dist/published-release.json
          else
            python scripts/validate-release-notes.py --tag "$RELEASE_TAG" --published dist/published-release.json --allow-legacy
          fi
