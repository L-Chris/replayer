name: Desktop build and release
on:
  push:
    branches: [main, feat/remdia-windows, feat/remdia-macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-runtime:
    name: FFmpeg-free remdia components
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned SDK revision
        id: sdk
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^remdia\s*=\s*\{[^}]*rev\s*=\s*"([a-f0-9]{40})"') { throw 'Missing pinned remdia revision' }
          "revision=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: L-Chris/remdia
          ref: ${{ steps.sdk.outputs.revision }}
          path: .deps/remdia-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            .deps/remdia-source/target
          key: windows-remdia-v2-${{ steps.sdk.outputs.revision }}
          restore-keys: windows-remdia-v2-
      - name: Build native component DLLs and CLI
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Release
        working-directory: .deps/remdia-source
      - uses: actions/upload-artifact@v4
        with:
          name: windows-remdia-runtime
          include-hidden-files: true
          path: |
            .deps/remdia-source/dist/remdia/**
            .deps/remdia-source/tests/fixtures/**
          if-no-files-found: error

  build:
    needs: windows-runtime
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-remdia-player-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-remdia-player-
            windows-x64-
      - uses: actions/download-artifact@v4
        with:
          name: windows-remdia-runtime
          path: target/windows-runtime
      - name: Configure native SDK
        shell: pwsh
        run: |
          ./scripts/setup-windows.ps1 -RuntimeDirectory target/windows-runtime/dist/remdia
          "REPLAYER_NATIVE_FIXTURES=$PWD/target/windows-runtime/tests/fixtures" >> $env:GITHUB_ENV
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Windows host
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Native component integration tests
        run: cargo test --locked --target x86_64-pc-windows-msvc native_media -- --ignored --nocapture
      - name: Offline host regression tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Clock and color checks
        shell: pwsh
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc player::clock::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc limited_range_black_and_white
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq replayer).version
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_TAG -cne "v$version") { throw "Tag must match Cargo.toml" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build Windows x64
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Build installer and portable package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/replayer.exe
      - name: Smoke test installed package without build paths
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'replayer-native-smoke'
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          ./scripts/test-installed-icons.ps1 -Installer $setup.FullName -InstallDirectory $installDir
          $media = (Resolve-Path target/windows-runtime/tests/fixtures/av.mp4).Path
          $savedPath = $env:PATH
          $savedPlugins = $env:REMDIA_PLUGIN_DIR
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:REMDIA_PLUGIN_DIR -ErrorAction SilentlyContinue
            $log = Join-Path $env:RUNNER_TEMP 'replayer-native-selftest.log'
            $errors = Join-Path $env:RUNNER_TEMP 'replayer-native-selftest.err'
            $process = Start-Process -FilePath (Join-Path $installDir 'replayer.exe') -ArgumentList @('--selftest', ('"' + $media + '"')) -WorkingDirectory $installDir -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $errors -Wait -PassThru
            Get-Content $log, $errors
            if ($process.ExitCode -ne 0) { throw "Installed native selftest failed: $($process.ExitCode)" }
          } finally { $env:PATH = $savedPath; $env:REMDIA_PLUGIN_DIR = $savedPlugins }
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: replayer-${{ env.APP_VERSION }}-windows-x86_64-remdia
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    if: github.ref != 'refs/heads/feat/remdia-windows'
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Check formatting and release version
        run: |
          cargo fmt --all -- --check
          version=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "replayer"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must be v$version to match Cargo.toml" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install native build tools
        run: command -v cmake || brew install cmake
      - uses: actions/cache/restore@v4
        id: mac-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deps/remdia-source/target
            target
          key: macos-remdia-v3-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-remdia-v3-${{ matrix.target }}-
      - name: Build pinned native SDK
        run: |
          REMDIA_TARGET='${{ matrix.target }}' ./scripts/setup-macos.sh
          echo "REPLAYER_NATIVE_FIXTURES=$PWD/.deps/remdia-source/tests/fixtures" >> "$GITHUB_ENV"
      - name: Lint and test host plus real media components
        run: |
          source '.deps/macos-${{ matrix.arch }}/env.sh'
          cargo clippy --locked --target '${{ matrix.target }}' --all-targets -- -D warnings
          REPLAYER_SETTINGS_FILE="$PWD/target/ci-macos-settings.json" cargo test --locked --target '${{ matrix.target }}'
          cargo test --locked --target '${{ matrix.target }}' native_media -- --ignored --nocapture
      - name: Build macOS application
        run: ./scripts/build-macos.sh --release --target '${{ matrix.target }}'
      - name: Package and test relocated application
        run: |
          source '.deps/macos-${{ matrix.arch }}/env.sh'
          python3 scripts/package-macos.py --binary 'target/${{ matrix.target }}/release/replayer' --output-directory 'dist/macos-${{ matrix.arch }}'
          python3 scripts/test-macos-package.py --directory 'dist/macos-${{ matrix.arch }}'
      - uses: actions/cache/save@v4
        if: always() && steps.mac-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .deps/remdia-source/target
            target
          key: ${{ steps.mac-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: replayer-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}
          path: |
            dist/macos-${{ matrix.arch }}/*.dmg
            dist/macos-${{ matrix.arch }}/*.zip
            dist/macos-${{ matrix.arch }}/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: replayer-*
          path: dist
          merge-multiple: true
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Canonical LF endings across the PowerShell and macOS manifests.
          tr -d '\r' < dist/SHA256SUMS.txt > dist/SHA256SUMS-windows-x86_64.txt
          cat dist/SHA256SUMS-windows-x86_64.txt dist/SHA256SUMS-macos-*.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          assets=(dist/*.exe dist/*.zip dist/*.dmg dist/SHA256SUMS*.txt)
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
          else
            NOTES="docs/releases/$RELEASE_TAG.md"
            python scripts/validate-release-notes.py --tag "$RELEASE_TAG" --file "$NOTES"
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          gh release view "$RELEASE_TAG" --json name,tagName,body > dist/published-release.json
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            python scripts/validate-release-notes.py --tag "$RELEASE_TAG" --file "docs/releases/$RELEASE_TAG.md" --published dist/published-release.json
          else
            python scripts/validate-release-notes.py --tag "$RELEASE_TAG" --published dist/published-release.json --allow-legacy
          fi
