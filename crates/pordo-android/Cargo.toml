[package]
name = "pordo-android"
# Keep in lockstep with the application version; core source user agents embed it.
version = "0.5.1"
edition = "2024"
description = "Android JNI bridge exposing pordo-core and remedia media sessions as libpordo_android.so."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
pordo-core = { path = "../pordo-core", version = "0.5.1" }

# The bridge only exists on Android; host builds produce an empty library so
# desktop workspaces keep compiling every member.
[target.'cfg(target_os = "android")'.dependencies]
anyhow = "1"
jni = { version = "0.21.1", default-features = false }
# reqwest 0.13 verifies TLS through rustls-platform-verifier, which on Android
# must be handed the app context; it links jni 0.22 while this bridge uses
# 0.21, so the initializer is reached through raw pointers via this alias.
jni22 = { package = "jni", version = "0.22.4", default-features = false }
# The platform verifier reports verification details (e.g. the Android message
# behind a "Revoked" status) through `log`; without a logger they vanish.
log = "0.4"
rustls-platform-verifier = "0.7"
# Same pinned revision as the core. builtin-src adds the resampler used by
# Android audio conversion, matching remdia-sdk's Android feature set.
remdia = { git = "https://github.com/PordoTech/remdia.git", rev = "6e6444ff7c4e60cff55e0a61172c5ec47d837cc3", features = ["bundled", "builtin-src"] }
remdia-android-platform = { git = "https://github.com/PordoTech/remdia.git", rev = "6e6444ff7c4e60cff55e0a61172c5ec47d837cc3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
