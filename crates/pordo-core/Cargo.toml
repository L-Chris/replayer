[package]
name = "pordo-core"
# Keep in lockstep with the application version: comic/music source user agents
# embed CARGO_PKG_VERSION and must stay identical across desktop and Android.
version = "0.5.1"
edition = "2024"
description = "Platform-neutral pordo logic: comic/music sources, library, caches, downloads, lyrics and remdia media jobs."
license = "MIT"

[features]
# Expose pixels.rs test helpers (generated/solid/black/format/test_support) to
# dependents; the desktop app enables this for its own unit tests.
test-support = []

[dependencies]
anyhow = "1"
# Share the crypto implementation already used by rustls and librqbit.
aws-lc-rs = { version = "1", default-features = false, features = ["alloc", "non-fips"] }
base64 = "0.22"
quick-xml = "0.42"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
crossbeam-channel = "0.5.17"
futures-util = "0.3"
regex = "1"
# Same pinned SDK revision as the application; bundled registers the built-in
# factories on every platform, including the Android framework pack.
remdia = { git = "https://github.com/PordoTech/remdia.git", rev = "6e6444ff7c4e60cff55e0a61172c5ec47d837cc3", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "query", "rustls", "cookies"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
dotenvy = "0.15"
