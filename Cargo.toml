[package]
name = "replayer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = "1.25.2"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = "0.36"
ffmpeg-next = "9.0"
rfd = "0.17.2"
rtrb = "0.3"
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
unicode-segmentation = "1"
unicode-width = "0.2"
sha2 = "0.10"
semver = "1"

[profile.release]
lto = true
codegen-units = 1
