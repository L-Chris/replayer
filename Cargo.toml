[package]
name = "replayer"
version = "0.4.3"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = "1.25.2"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = "0.36"
egui-phosphor = { version = "0.14", features = ["subset"] }
# Playback and subtitle export use independent remdia component graphs.
remdia = { git = "https://github.com/L-Chris/remdia.git", rev = "753d39095000676698c917a8315072c1e6b7a1be" }
rfd = "0.17.2"
rtrb = "0.3"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
unicode-segmentation = "1"
unicode-width = "0.2"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
quick-xml = "0.42"
ring = "0.17"
semver = "1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tc_tea = { version = "0.2.1", default-features = false }

[features]
# Compatibility alias: remdia is now the default on every host.
remdia-media = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
dotenvy = "0.15"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Pixel conversion is hot even when the rest of the UI is built for debugging.
[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.ecolor]
opt-level = 3
