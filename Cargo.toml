[package]
name = "replayer"
version = "0.4.2"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = "1.25.2"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = "0.36"
egui-phosphor = { version = "0.14", features = ["subset"] }
# Windows playback and subtitle export use independent remdia component graphs.
remdia = { git = "https://github.com/L-Chris/remdia.git", rev = "5d919c706e87725c0cadcb1105da951f3f21629f" }
rfd = "0.17.2"
rtrb = "0.3"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
unicode-segmentation = "1"
unicode-width = "0.2"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
quick-xml = "0.42"
ring = "0.17"
semver = "1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tc_tea = { version = "0.2.1", default-features = false }
replayer-image = { path = "crates/replayer-image" }

[features]
# Windows always uses remdia. This feature also enables its portable audio path
# on other hosts for integration tests; native video remains Windows-only.
remdia-media = []

[target.'cfg(not(windows))'.dependencies]
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
dotenvy = "0.15"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Keep the fixed debug preview responsive when decoding full comic pages.
# Application code retains normal debug information and fast incremental builds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.replayer-image]
opt-level = 3

# Pixel conversion is hot even when the rest of the UI is built for debugging.
[profile.dev.package.epaint]
opt-level = 3

[profile.dev.package.ecolor]
opt-level = 3
